<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Varshith Sandaka — Portfolio</title>
    <style>
      body {

        color: #1d1813;
      }
      a {
        color: inherit;
      }
      .card {
        max-width: 36rem;
        padding: 2rem;
        border: 1px solid #d6c9a8;
        border-radius: 1rem;
        background: rgba(250, 246, 236, 0.92);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
      }
      .card h1 {
        margin: 0 0 0.75rem;
        font-size: 2rem;
      }
      .card p {
        margin: 0 0 1.25rem;
        line-height: 1.6;
        color: #5a4f40;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .links a {
        padding: 0.8rem 1rem;
        border-radius: 999px;
        border: 1px solid #1d1813;
        text-decoration: none;
      }
      .links a.primary {
        background: #1d1813;
        color: #faf6ec;
      }

  <body>
    <main class="card">
      <h1>Varshith Sandaka</h1>
      <p>The portfolio is live. If the redirect does not fire, use one of the links below.</p>
